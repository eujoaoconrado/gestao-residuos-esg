spring:
  application:
    name: gestao-residuos-esg

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/residuos}
    username: ${DB_USER:residuos}
    password: ${DB_PASSWORD:residuos123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Actuator: so o health fica exposto (usado no smoke test do pipeline)
management:
  endpoints:
    web:
      exposure:
        include: health

# Configuracao do JWT
jwt:
  secret: ${JWT_SECRET:Z2VzdGFvLXJlc2lkdW9zLWVzZy1zZWNyZXQta2V5LXBhcmEtZmlhcC1mYXNlMy1jYXAtOA==}
  expiration: ${JWT_EXPIRATION:86400000}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    br.com.fiap.gestaoresiduos: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
