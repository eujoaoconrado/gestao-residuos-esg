services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: gestao-residuos-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: residuos
      APP_USER_PASSWORD: residuos123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  app:
    build: .
    container_name: gestao-residuos-app
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORACLE_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      ORACLE_USER: system
      ORACLE_PASSWORD: oracle
      JWT_SECRET: Z2VzdGFvLXJlc2lkdW9zLWVzZy1zZWNyZXQta2V5LXBhcmEtZmlhcC1mYXNlMy1jYXAtOA==
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"

volumes:
  oracle_data:
