services:
  db:
    image: postgres:16-alpine
    container_name: gestao-residuos-db
    environment:
      POSTGRES_DB: residuos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d residuos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - residuos-net

  app:
    build: .
    container_name: gestao-residuos-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/residuos
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "8080:8080"
    networks:
      - residuos-net

volumes:
  postgres_data:

networks:
  residuos-net:
