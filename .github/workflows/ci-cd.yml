name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # roda os testes, gera o jar e testa o build da imagem docker
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      - name: Guardar o jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: gestao-residuos-esg-jar
          path: target/*.jar

      - name: Build da imagem docker
        run: docker build -t gestao-residuos-esg .

  # staging: sobe app + postgres com docker compose no proprio runner e testa
  deploy-staging:
    needs: build-e-testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Criar arquivo de ambiente
        run: cp .env.staging.example .env.staging

      - name: Subir ambiente de staging
        run: docker compose -f docker-compose.staging.yml up -d --build

      - name: Esperar a aplicação subir
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8081/actuator/health; then
              echo ""
              echo "Aplicacao no ar"
              exit 0
            fi
            echo "Tentativa $i, esperando 5s..."
            sleep 5
          done
          echo "Aplicacao nao subiu"
          exit 1

      - name: Testar login na API
        run: |
          RESPOSTA=$(curl -fsS -X POST localhost:8081/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "admin@fiap.com", "senha": "admin123"}')
          echo "$RESPOSTA" | cut -c1-60
          echo "$RESPOSTA" | grep -q token

      # usa o token para chamar um endpoint protegido e ver se o seed do postgres foi lido
      - name: Testar endpoint com token
        run: |
          TOKEN=$(curl -fsS -X POST localhost:8081/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "admin@fiap.com", "senha": "admin123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          EMPRESAS=$(curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8081/empresas)
          echo "$EMPRESAS" | grep -q EcoBrasil
          echo "Endpoint /empresas respondeu com os dados do seed"

      - name: Mostrar containers
        run: docker compose -f docker-compose.staging.yml ps

      - name: Logs da aplicação
        run: docker compose -f docker-compose.staging.yml logs app | tail -n 40

      - name: Derrubar ambiente
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  # producao: mesma coisa, mas so roda depois da aprovacao manual no environment production
  deploy-producao:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # em producao as senhas vem dos secrets do repositorio, nao do arquivo de exemplo
      - name: Criar arquivo de ambiente
        env:
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          printf "DB_USER=residuos_prod\nDB_PASSWORD=%s\nPOSTGRES_USER=residuos_prod\nPOSTGRES_PASSWORD=%s\nJWT_SECRET=%s\nJWT_EXPIRATION=86400000\n" \
            "$PROD_DB_PASSWORD" "$PROD_DB_PASSWORD" "$PROD_JWT_SECRET" > .env.prod

      - name: Subir ambiente de producao
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Esperar a aplicação subir
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/actuator/health; then
              echo ""
              echo "Aplicacao no ar"
              exit 0
            fi
            echo "Tentativa $i, esperando 5s..."
            sleep 5
          done
          echo "Aplicacao nao subiu"
          exit 1

      - name: Testar login na API
        run: |
          RESPOSTA=$(curl -fsS -X POST localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "admin@fiap.com", "senha": "admin123"}')
          echo "$RESPOSTA" | cut -c1-60
          echo "$RESPOSTA" | grep -q token

      # usa o token para chamar um endpoint protegido e ver se o seed do postgres foi lido
      - name: Testar endpoint com token
        run: |
          TOKEN=$(curl -fsS -X POST localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "admin@fiap.com", "senha": "admin123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          EMPRESAS=$(curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8080/empresas)
          echo "$EMPRESAS" | grep -q EcoBrasil
          echo "Endpoint /empresas respondeu com os dados do seed"

      - name: Mostrar containers
        run: docker compose -f docker-compose.prod.yml ps

      - name: Logs da aplicação
        run: docker compose -f docker-compose.prod.yml logs app | tail -n 40

      - name: Derrubar ambiente
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
